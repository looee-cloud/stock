<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹿意文創 | 雲端庫存管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .low-stock-pulse { animation: pulse 2s infinite; border: 2px solid #ff4d4d; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); } }
        optgroup { font-weight: bold; color: #6366f1; background: #f8fafc; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800">

    <nav class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold">鹿</div>
                <span class="font-bold tracking-widest text-lg">鹿意文創 <span class="text-slate-400 font-light text-sm">| 庫存系統</span></span>
            </div>
            <button onclick="toggleAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">＋ 新增入庫</button>
        </div>
        <div id="brandTabs" class="max-w-4xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto scrollbar-hide"></div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div id="inventoryContainer" class="space-y-3">
            <div id="loadingMsg" class="text-center py-20 text-slate-400">正在連線雲端資料庫...</div>
        </div>
    </main>

    <!-- 新增品項 Modal -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl p-6 overflow-hidden">
            <h2 class="text-lg font-bold mb-4">📦 商品入庫</h2>
            <div class="grid grid-cols-2 gap-4 mb-6 max-h-[60vh] overflow-y-auto pr-2">
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400">品牌</label>
                    <input id="inBrand" type="text" placeholder="例如: UnitedAthle" class="w-full bg-slate-50 border-0 rounded-xl p-3 outline-none mt-1">
                </div>
                
                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400">品項分類</label>
                    <select id="inType" class="w-full bg-slate-50 border-0 rounded-xl p-3 outline-none mt-1">
                        <option value="棉質短T">棉質短T</option>
                        <option value="重磅短T">重磅短T</option>
                        <option value="排汗短T">排汗短T</option>
                        <option value="其他短T">其他短T</option>
                        <option value="POLO衫(短袖/長袖)">POLO衫(短袖/長袖)</option>
                        <option value="大學T">大學T</option>
                        <option value="帽T">帽T</option>
                        <option value="長袖棉T">長袖棉T</option>
                        <option value="帆布袋(SM/M/L)">帆布袋(SM/M/L)</option>
                        <option value="帆布側背小袋(F)">帆布側背小袋(F)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400">顏色</label>
                    <input id="inColor" type="text" placeholder="白色" class="w-full bg-slate-50 border-0 rounded-xl p-3 outline-none mt-1">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400">尺寸標籤</label>
                    <select id="inSize" class="w-full bg-slate-50 border-0 rounded-xl p-3 outline-none mt-1">
                        <optgroup label="🟡 黃色標籤 (童裝)">
                            <option value="90CM">90CM</option>
                            <option value="100CM">100CM</option>
                            <option value="110CM">110CM</option>
                            <option value="120CM">120CM</option>
                            <option value="130CM">130CM</option>
                            <option value="140CM">140CM</option>
                            <option value="150CM">150CM</option>
                            <option value="160CM">160CM</option>
                        </optgroup>
                        <optgroup label="💗 粉色標籤 (女裝)">
                            <option value="GS">GS</option>
                            <option value="GM">GM</option>
                            <option value="GL">GL</option>
                            <option value="GXL">GXL</option>
                            <option value="GXXL">GXXL</option>
                        </optgroup>
                        <optgroup label="🔵 藍色標籤 (中性)">
                            <option value="XS">XS</option>
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="2XL">2XL</option>
                            <option value="3XL">3XL</option>
                            <option value="4XL">4XL</option>
                            <option value="5XL">5XL</option>
                            <option value="7XL">7XL</option>
                        </optgroup>
                        <optgroup label="⚪ 其他">
                            <option value="F">F (One Size)</option>
                            <option value="SM">SM</option>
                        </optgroup>
                    </select>
                </div>

                <div class="col-span-2">
                    <label class="text-[10px] font-bold text-slate-400">入庫數量</label>
                    <input id="inQty" type="number" value="1" class="w-full bg-slate-50 border-0 rounded-xl p-3 outline-none mt-1">
                </div>

                <div class="flex items-center gap-2 pt-2"><input type="checkbox" id="isStaple" class="w-5 h-5 accent-indigo-600"> <span class="text-sm font-bold text-slate-600">設為黑/白常備款</span></div>
            </div>
            <button onclick="saveToCloud()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">儲存至雲端</button>
            <button onclick="toggleAddModal()" class="w-full mt-2 text-slate-400 text-sm">取消</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCy_-KebfXkpKNPzDUgAKE2JLHyTEZjzO0",
            authDomain: "looee-stock.firebaseapp.com",
            databaseURL: "https://looee-stock-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "looee-stock",
            storageBucket: "looee-stock.firebasestorage.app",
            messagingSenderId: "1068251648781",
            appId: "1:1068251648781:web:f332fca91c53afdb425644",
            measurementId: "G-BT7ZC0N23R"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stockRef = ref(db, 'inventory');

        let inventory = [];
        let currentBrand = '全部';

        onValue(stockRef, (snapshot) => {
            const data = snapshot.val();
            inventory = data ? Object.values(data) : [];
            render();
        }, (error) => {
            document.getElementById('loadingMsg').innerHTML = `<span class="text-rose-500">連線失敗</span>`;
        });

        window.saveToCloud = function() {
            const id = Date.now().toString();
            const newItem = {
                id,
                brand: document.getElementById('inBrand').value.trim() || "未命名品牌",
                type: document.getElementById('inType').value,
                color: document.getElementById('inColor').value.trim() || "未指定顏色",
                size: document.getElementById('inSize').value,
                qty: parseInt(document.getElementById('inQty').value) || 0,
                isStaple: document.getElementById('isStaple').checked
            };
            set(ref(db, 'inventory/' + id), newItem);
            toggleAddModal();
        };

        window.changeQty = function(id, delta) {
            const item = inventory.find(i => i.id == id);
            if(item) {
                const newQty = Math.max(0, item.qty + delta);
                set(ref(db, 'inventory/' + id + '/qty'), newQty);
            }
        };

        window.deleteItem = function(id) {
            if(confirm('確定移除此庫存？')) remove(ref(db, 'inventory/' + id));
        };

        window.render = function() {
            const container = document.getElementById('inventoryContainer');
            const filtered = currentBrand === '全部' ? inventory : inventory.filter(i => i.brand === currentBrand);
            const brands = ['全部', ...new Set(inventory.map(i => i.brand))];
            
            document.getElementById('brandTabs').innerHTML = brands.map(b => `
                <button onclick="window.setBrand('${b}')" class="whitespace-nowrap px-6 py-1.5 rounded-xl text-sm font-bold transition ${currentBrand === b ? 'bg-slate-900 text-white' : 'bg-white text-slate-400 border border-slate-100'}">${b}</button>
            `).join('');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-400">目前沒有庫存。</div>`;
            } else {
                container.innerHTML = filtered.map(item => `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center ${item.isStaple && item.qty < 5 ? 'low-stock-pulse' : ''}">
                        <div class="flex-1">
                            <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">${item.brand}</span>
                            <h3 class="font-bold text-slate-800">${item.color} · ${item.type}</h3>
                            <p class="text-xs text-slate-400 font-medium">SIZE: ${item.size}</p>
                        </div>
                        <div class="flex items-center bg-slate-50 rounded-xl p-1">
                            <button onclick="window.changeQty('${item.id}', -1)" class="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold active:scale-90">-</button>
                            <span class="px-4 font-mono font-bold text-lg text-center w-12">${item.qty}</span>
                            <button onclick="window.changeQty('${item.id}', 1)" class="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold active:scale-90">+</button>
                        </div>
                        <button onclick="window.deleteItem('${item.id}')" class="ml-2 text-slate-200 hover:text-rose-300 transition p-2">✕</button>
                    </div>
                `).join('');
            }
        };

        window.setBrand = (b) => { currentBrand = b; render(); };
        window.toggleAddModal = () => document.getElementById('addModal').classList.toggle('hidden');
    </script>
</body>
</html>
