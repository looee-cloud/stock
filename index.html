<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鹿意文創 | 雲端庫存管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen pb-24 text-slate-800">

    <!-- 頂部導覽列 -->
    <nav class="sticky top-0 z-30 bg-white/80 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold">鹿</div>
                <span class="font-bold tracking-widest text-lg">鹿意文創 <span class="text-slate-400 font-light text-sm">| 庫存系統</span></span>
            </div>
            <button onclick="toggleAddModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md">＋ 新增入庫</button>
        </div>
        <div id="brandTabs" class="max-w-4xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto"></div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div id="inventoryContainer" class="space-y-3">
            <div class="text-center py-20 text-slate-400">正在連線雲端資料庫...</div>
        </div>
    </main>

    <!-- 新增品項 Modal (保持之前的設計) -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/50 z-40 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl p-6">
            <h2 class="text-lg font-bold mb-4">📦 商品入庫</h2>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <input id="inBrand" type="text" placeholder="品牌" class="col-span-2 bg-slate-50 border-0 rounded-xl p-3 outline-none">
                <select id="inType" class="col-span-2 bg-slate-50 border-0 rounded-xl p-3 outline-none">
                    <option value="棉質重磅">棉質重磅</option>
                    <option value="排汗短T">排汗短T</option>
                    <option value="大學T">大學T</option>
                    <option value="帽T">帽T</option>
                    <option value="POLO衫">POLO衫</option>
                </select>
                <input id="inColor" type="text" placeholder="顏色" class="bg-slate-50 border-0 rounded-xl p-3 outline-none">
                <input id="inSize" type="text" placeholder="尺寸" class="bg-slate-50 border-0 rounded-xl p-3 outline-none">
                <input id="inQty" type="number" placeholder="數量" class="bg-slate-50 border-0 rounded-xl p-3 outline-none">
                <div class="flex items-center gap-2 pt-4"><input type="checkbox" id="isStaple" class="w-5 h-5 accent-indigo-600"> <span class="text-sm font-bold text-slate-600">常備款</span></div>
            </div>
            <button onclick="saveToCloud()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">儲存至雲端</button>
            <button onclick="toggleAddModal()" class="w-full mt-2 text-slate-400 text-sm">取消</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // const firebaseConfig = {
            apiKey: "AIzaSyCy_-KebfXkpKNPzDUgAKE2JLHyTEZjzO0",
            authDomain: "looee-stock.firebaseapp.com",
            databaseURL: "https://looee-stock-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "looee-stock",
            storageBucket: "looee-stock.firebasestorage.app",
            messagingSenderId: "1068251648781",
            appId: "1:1068251648781:web:f332fca91c53afdb425644",
            measurementId: "G-BT7ZC0N23R"
        };
        const firebaseConfig = {
            apiKey: "貼上你的內容",
            authDomain: "貼上你的內容",
            databaseURL: "貼上你的內容",
            projectId: "貼上你的內容",
            storageBucket: "貼上你的內容",
            messagingSenderId: "貼上你的內容",
            appId: "貼上你的內容"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const stockRef = ref(db, 'inventory');

        let inventory = [];
        let currentBrand = '全部';

        // 從雲端即時抓取資料
        onValue(stockRef, (snapshot) => {
            const data = snapshot.val();
            inventory = data ? Object.values(data) : [];
            render();
        });

        window.saveToCloud = function() {
            const id = Date.now().toString();
            const newItem = {
                id,
                brand: document.getElementById('inBrand').value.trim(),
                type: document.getElementById('inType').value,
                color: document.getElementById('inColor').value.trim(),
                size: document.getElementById('inSize').value.trim().toUpperCase(),
                qty: parseInt(document.getElementById('inQty').value) || 0,
                isStaple: document.getElementById('isStaple').checked
            };
            if(!newItem.brand || !newItem.color) return alert('品牌與顏色必填');
            
            set(ref(db, 'inventory/' + id), newItem);
            toggleAddModal();
        };

        window.changeQty = function(id, delta) {
            const item = inventory.find(i => i.id == id);
            if(item) {
                const newQty = Math.max(0, item.qty + delta);
                set(ref(db, 'inventory/' + id + '/qty'), newQty);
            }
        };

        window.deleteItem = function(id) {
            if(confirm('確定移除此庫存？')) remove(ref(db, 'inventory/' + id));
        };

        window.render = function() {
            const container = document.getElementById('inventoryContainer');
            const filtered = currentBrand === '全部' ? inventory : inventory.filter(i => i.brand === currentBrand);
            
            // 渲染 Tab
            const brands = ['全部', ...new Set(inventory.map(i => i.brand))];
            document.getElementById('brandTabs').innerHTML = brands.map(b => `
                <button onclick="window.setBrand('${b}')" class="whitespace-nowrap px-6 py-1.5 rounded-xl text-sm font-bold transition ${currentBrand === b ? 'bg-slate-900 text-white' : 'bg-white text-slate-400 border border-slate-100'}">${b}</button>
            `).join('');

            container.innerHTML = filtered.map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                    <div>
                        <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">${item.brand}</span>
                        <h3 class="font-bold text-slate-800">${item.color} · ${item.type}</h3>
                        <p class="text-xs text-slate-400 font-medium">SIZE: ${item.size}</p>
                    </div>
                    <div class="flex items-center bg-slate-50 rounded-xl p-1">
                        <button onclick="window.changeQty('${item.id}', -1)" class="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold">-</button>
                        <span class="px-4 font-mono font-bold text-lg">${item.qty}</span>
                        <button onclick="window.changeQty('${item.id}', 1)" class="w-9 h-9 flex items-center justify-center bg-white border rounded-lg shadow-sm font-bold">+</button>
                    </div>
                    <button onclick="window.deleteItem('${item.id}')" class="text-[10px] text-slate-200">✕</button>
                </div>
            `).join('');
        };

        window.setBrand = (b) => { currentBrand = b; render(); };
        window.toggleAddModal = () => document.getElementById('addModal').classList.toggle('hidden');
    </script>
</body>
</html>
